org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true

# Where the core's sources live, relative to this directory. The monorepo keeps them in the sibling
# package; the staged public repository (scripts/publish-sdk-android.sh) copies them to
# core/src/main/kotlin and rewrites this one line.
attrikit.coreSources=core/src/main/kotlin

# The Maven groupId of the publication. JitPack serves a GitHub repository under
# com.github.<owner>. Moving to io.attrikit is this one line, but only after a DNS TXT record maps
# git.attrikit.io to https://github.com/KamyarTaher: JitPack refuses a custom group it cannot tie
# to the repository owner.
attrikit.group=com.github.KamyarTaher
